[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every path resolves to the shell, which then routes client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Internal tool. Keep it out of indexes and out of frames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
