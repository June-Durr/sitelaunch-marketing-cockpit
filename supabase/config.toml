# Supabase CLI project configuration.
#
# This file exists for one reason that matters: it records verify_jwt = false for
# every sync function, so a deploy cannot accidentally be made with platform JWT
# checking left on.
#
# That is not a relaxation. The scheduler calls these functions with an
# x-sync-cron-secret header and no Authorization header at all, so platform JWT
# checking would reject every scheduled run with a 401 before the function body
# ran. The functions authorise themselves in server/integrations/requestAuth.ts,
# which accepts either that shared secret or a real user session and refuses
# everything else with one identical 401. Leaving it on would break the schedule
# without making anything safer.

project_id = "megfxrktnmhzhnnnsnub"

[functions.sync-ga4]
verify_jwt = false

[functions.sync-search-console]
verify_jwt = false

# The lead mirror, for the same reason. It is called by a person pressing a button
# with their own session, and on a schedule with the shared secret and no
# Authorization header at all, and resolveCaller is what tells those apart.
[functions.sync-lead-mirror]
verify_jwt = false

# The calendar sync, for the same reason. It is called by a person pressing Sync
# now with their own session, and on a schedule with the shared secret and no
# Authorization header at all.
[functions.sync-calendar]
verify_jwt = false

# Starting and ending a Google Calendar connection.
#
# This one needs a real session and nothing else, and it enforces that itself
# with requireUser, which accepts a Bearer token only and refuses the cron secret
# outright: a shared secret cannot consent on somebody's behalf. Platform JWT
# checking is left off for consistency with the rest, and because the function's
# own check is the stricter of the two.
[functions.calendar-oauth]
verify_jwt = false

# Google's redirect target.
#
# This is the one function that genuinely cannot have platform JWT checking.
# Google sends a browser here with a code and a state and no Supabase session, so
# verify_jwt = true would reject every real callback before the body ran. It does
# its own check first instead: the state is consumed before any write and before
# the code is exchanged, and a state that is forged, replayed, expired or unknown
# ends the request having changed nothing.
[functions.calendar-oauth-callback]
verify_jwt = false
